# 提交前自动检查。安装钩子：cd backend && uv run pre-commit install
# 工具版本由 backend/uv.lock 固定，不在此处单独指定。
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      # 前端：ESLint + Prettier 检查。需要先在 frontend/ 中执行 npm install。
      # 直接用 node 调用，避免在 Windows 上找不到 npm.cmd。
      - id: frontend-check
        name: eslint + prettier check (frontend)
        entry: node frontend/scripts/check.mjs
        language: system
        files: ^frontend/
        pass_filenames: false
