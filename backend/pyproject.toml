[project]
name = "pet-backend"
version = "0.1.0"
description = "桌面宠物后端（自用）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 提示词正文是数据，不是代码：长行是提示词本身的内容，不应被行宽规则改写。
"module/agent/chat_system_prompt.py" = ["E501"]
"scripts/rewrite_structured.py" = ["E501"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
