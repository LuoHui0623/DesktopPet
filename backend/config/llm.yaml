# 模型预设。不含密钥，可入 Git。
# provider 名须与 .env 中 LLM_PROVIDERS 一致。
# 解析规则见 backend/config/README.md。
#
# api 为每个模型的接口范式，只能取以下三个值：
#   chat_completions  OpenAI 兼容 chat/completions 接口
#   responses         OpenAI Responses 接口
#   messages          Anthropic messages 接口

providers:
  deepseek:
    display_name: DeepSeek
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        api: chat_completions
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        api: chat_completions
        roles: [chat]
        temperature: 0.7
        max_tokens: 2048

  opencode:
    display_name: OpenCode Go
    # 每个请求附带的固定请求头。x-opencode-session 用于标识会话，便于服务端路由与缓存。
    request_header:
      x-opencode-session: ec50d820-8c4d-497f-a79b-7645b217eb87
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash（OpenCode Go）
        api: chat_completions
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: gpt-5.6-luna
        name: GPT 5.6 Luna（OpenCode Go）
        api: responses
        roles: [chat]
        temperature: 0.7
        max_tokens: 1024
      - id: claude-haiku-5-5
        name: Claude Haiku 5.5（OpenCode Go）
        api: messages
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
