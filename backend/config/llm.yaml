# 模型预设。不含密钥，可入 Git。
# provider 名须与 .env 中 LLM_PROVIDERS 一致。
# 解析规则见 backend/config/README.md。
#
# api 为每个模型的接口范式，取值：
#   openai_chat        OpenAI 兼容 chat/completions
#   openai_responses   OpenAI Responses 接口
#   anthropic_messages Anthropic messages 接口

providers:
  deepseek:
    display_name: DeepSeek
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        api: openai_chat
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        api: openai_chat
        roles: [chat]
        temperature: 0.7
        max_tokens: 2048

  opencode:
    display_name: OpenCode Go
    # 每个请求附带的固定请求头。x-opencode-session 用于标识会话，便于服务端路由与缓存。
    request_header:
      x-opencode-session: ec50d820-8c4d-497f-a79b-7645b217eb87
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash（OpenCode Go）
        api: openai_chat
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro（OpenCode Go）
        api: openai_chat
        roles: [chat]
        temperature: 0.7
        max_tokens: 2048
      - id: glm-5.3-flash
        name: GLM 5.3 Flash（OpenCode Go）
        api: openai_chat
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: gpt-5.6-luna
        name: GPT 5.6 Luna（OpenCode Go）
        api: openai_responses
        roles: [chat]
        temperature: 0.7
        max_tokens: 1024
      - id: claude-haiku-5-5
        name: Claude Haiku 5.5（OpenCode Go）
        api: anthropic_messages
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
