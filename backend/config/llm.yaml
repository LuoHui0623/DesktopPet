# 模型预设。不含密钥，可入 Git。
# provider 名须与 .env 中 LLM_PROVIDERS 一致。
# 解析规则见 backend/config/README.md。
#
# 每个模型两个标识：
#   name  标签，在同一 provider 内唯一。.env 的 DEFAULT_*_MODEL 按此查找。
#   id    发给上游 API 的模型标识，不要求唯一。
#
# api 为接口范式，只能取以下三个值：
#   chat_completions  OpenAI 兼容 chat/completions 接口
#   responses         OpenAI Responses 接口
#   messages          Anthropic messages 接口
#
# context_window 为模型上下文窗口（输入 + 回复），默认 128000。
# tokenizer 为计数方式：tiktoken 编码名（如 cl100k_base / o200k_base），
# 或 estimate 表示使用本地估算。估算值会在错误里明确标注。

providers:
  deepseek:
    display_name: DeepSeek
    models:
      - name: deepseek-flash
        id: deepseek-flash
        api: chat_completions
        roles: [chat, consolidate]
        temperature: 0.5
        max_tokens: 10000
        context_window: 128000
        tokenizer: estimate
      - name: deepseek-v4-pro
        id: deepseek-v4-pro
        api: chat_completions
        roles: [chat]
        temperature: 0.5
        max_tokens: 2048
        context_window: 128000
        tokenizer: estimate

  opencode:
    display_name: OpenCode Go
    # 每个请求附带的固定请求头。x-opencode-session 用于标识会话，便于服务端路由与缓存。
    request_header:
      x-opencode-session: ec50d820-8c4d-497f-a79b-7645b217eb87
    models:
      - name: deepseek-v4.1-flash
        id: deepseek-v4.1-flash
        api: chat_completions
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 10000
        context_window: 128000
        tokenizer: estimate
      - name: gpt-5.6-luna
        id: gpt-5.6-luna
        api: responses
        roles: [chat]
        temperature: 0.7
        max_tokens: 10000
        context_window: 400000
        tokenizer: o200k_base
      - name: claude-haiku-5-5
        id: claude-haiku-5-5
        api: messages
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 10000
        context_window: 200000
        tokenizer: estimate
