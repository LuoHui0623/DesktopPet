# 模型预设。不含密钥，可入 Git。
# provider 名须与 .env 中 LLM_PROVIDERS 一致。
# 默认模型在 .env 中通过 DEFAULT_<能力>_MODEL 指定，见 Arch.md §8.3。
#
# 注意：opencode 的免费模型（*-free）只能在 OpenCode 客户端中使用，
# 此处只列出付费模型，且为 OpenAI 兼容的 chat/completions 接口可用的模型。

providers:
  deepseek:
    display_name: DeepSeek
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        roles: [chat]
        temperature: 0.7
        max_tokens: 2048

  opencode:
    display_name: OpenCode
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash（OpenCode）
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
      - id: glm-5.3-flash
        name: GLM 5.3 Flash（OpenCode）
        roles: [chat, consolidate]
        temperature: 0.7
        max_tokens: 1024
